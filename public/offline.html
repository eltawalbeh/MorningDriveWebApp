<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080b10" />
    <title>Morning Drive — Offline</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #080b10; color: #f6f8fb; font-family: Arial, sans-serif; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 28px; }
      main { width: min(620px, 100%); text-align: center; }
      .mark { width: 72px; height: 72px; margin: 0 auto 24px; border-radius: 20px; display: grid; place-items: center; background: #f0a31a; color: #111; font-size: 42px; font-weight: 800; }
      h1 { margin: 0; font-size: clamp(36px, 8vw, 58px); line-height: 1; }
      p { margin: 18px auto 28px; max-width: 520px; color: #a2adba; font-size: 18px; line-height: 1.55; }
      button { min-height: 64px; min-width: 180px; padding: 0 28px; border: 0; border-radius: 17px; background: #f0a31a; color: #111; font-size: 17px; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">M</div>
      <h1>You’re offline.</h1>
      <p>Morning Drive needs an internet connection for YouTube and Ain FM. Reconnect, then try again.</p>
      <button onclick="location.reload()">Try Again</button>
    </main>
  </body>
</html>
